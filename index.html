<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>WebSend</title>
<link rel="stylesheet" href="style.css">
<script src="qrcode.js" defer></script>
<script src="client-zip.js" defer></script>
<script src="sound.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>WebSend</h1>
  <p id="status" role="status"></p>
</header>

<section id="start">
  <h2>Connect to another device</h2>
  <p>Files go straight from one device to the other. Nothing is uploaded.</p>
  <div>
    <button id="goSound">
      <b>Connect by sound</b>
      <span>Devices in the same room. Tap this on both and they find each other.</span>
    </button>
    <button id="goShow">
      <b>Show a QR code</b>
      <span>Scan it with the other device's camera, or send it the link.</span>
    </button>
    <button id="goJoin">
      <b>I have a code</b>
      <span>Paste the link or code the other device gave you.</span>
    </button>
  </div>
</section>

<section id="flow" hidden>
  <button id="back">← Back</button>
  <ol id="steps"></ol>
  <h2 id="title"></h2>
  <p id="hint"></p>

  <div id="show">
    <p id="making">Making a code…</p>
    <canvas id="qr" aria-label="Connection QR code"></canvas>
    <div id="codeBtns">
      <button id="copy">Copy link</button>
      <button id="copyCode">Copy code</button>
      <button id="share">Share…</button>
    </div>
    <input id="link" readonly aria-label="Connection link">
  </div>

  <div id="listen">
    <p id="soundMsg" aria-live="polite"></p>
    <p id="soundSub"></p>
  </div>

  <form id="pasteForm">
    <input id="paste" autocomplete="off" placeholder="Paste link or code" aria-label="Link or code">
    <button>Connect</button>
  </form>

  <button id="soundToggle"></button>
  <button id="next"></button>
  <button id="alt"></button>
</section>

<section id="main" hidden>
  <div id="sas"></div>
  <div id="drop">
    <p>Drop files or folders here</p>
    <button id="pickFiles">Add files</button> <button id="pickFolder">Add folder</button>
    <input type="file" id="files" multiple hidden>
    <input type="file" id="folder" webkitdirectory hidden>
  </div>
  <form id="textForm">
    <textarea id="text" rows="2" maxlength="100000" placeholder="Text or link to send"></textarea>
    <button id="sendText">Send text</button>
  </form>
</section>

<ul id="log"></ul>
<button id="hangup" hidden>Disconnect</button>
</body>
</html>
